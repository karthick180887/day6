services:
  jupyterlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: day6-ml-engineering-jupyterlab:latest
    container_name: day6-jupyterlab
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-day6-training}"
      RANDOM_SEED: "${RANDOM_SEED:-42}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Optional: leave blank for offline classroom use (no paid API keys required on Day 6)
      TRAINING_ENV: "${TRAINING_ENV:-classroom-local}"
    volumes:
      # Mount the Day 6 notebooks/ directory directly into JupyterLab
      # All edits, saved models, and experiment logs persist on the host machine
      - ../notebooks:/workspace/notebooks
    restart: unless-stopped
