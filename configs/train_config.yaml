# StreamPulse Churn Pipeline - Default Training Configuration
# Edit values here instead of hardcoding magic numbers inside notebooks or Python scripts.

project:
  name: streampulse-churn
  owner: day6-ml-cohort
  description: "End-to-end churn prediction pipeline for Day 6 ML Engineering training"

reproducibility:
  random_seed: 42
  test_size: 0.20
  cv_folds: 5

data:
  customers_csv: "data/customers_raw.csv"
  usage_json: "data/usage_events.json"
  target_column: "churned"
  id_column: "customer_id"

validation:
  min_age: 18
  max_age: 100
  min_tenure_months: 0
  max_monthly_charges: 100.0
  allowed_plan_tiers:
    - basic
    - standard
    - premium
  allowed_countries:
    - US
    - IN
    - UK
    - CA
    - DE
  max_missing_ratio: 0.15

features:
  numeric_columns:
    - age
    - tenure_months
    - monthly_charges
    - login_days_30d
    - watch_hours_30d
    - support_tickets_30d
    - auto_pay
    - charges_per_login
    - tickets_per_tenure_month
    - watch_hours_per_login
    - is_new_customer
  categorical_columns:
    - plan_tier
    - country
    - payment_method
    - last_active_device

model:
  type: "random_forest"   # Supported: "logistic_regression", "random_forest", "gradient_boosting"
  params:
    n_estimators: 120
    max_depth: 6
    min_samples_leaf: 4
    class_weight: "balanced"

artifacts:
  output_dir: "artifacts"
  experiment_log: "artifacts/experiments.jsonl"
  model_filename: "churn_pipeline.joblib"
